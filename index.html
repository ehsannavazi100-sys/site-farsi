  <style>
    :root {
      --bg: #080a0d;
      --bg2: #0d1116;
      --card: #11161c;
      --card2: #151b22;
      --text: #f5f5f5;
      --muted: #aeb7c2;
      --line: #26303a;
      --accent: #f59e0b;
      --accent2: #ffb52e;
      --green: #16a34a;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 80% 0%, rgba(245,158,11,.08), transparent 28%),
        var(--bg);
      color: var(--text);
      line-height: 1.9;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,10,13,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: #d7dde4;
      font-size: 14px;
      transition: .2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-phone {
      color: var(--accent);
      font-weight: 800;
      direction: ltr;
      white-space: nowrap;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 90px 0 75px;
      background:
        radial-gradient(circle at 72% 35%, rgba(245,158,11,.16), transparent 25%),
        linear-gradient(135deg, #090b0e, #111820);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 55px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid rgba(245,158,11,.45);
      border-radius: 999px;
      color: #ffd27a;
      background: rgba(245,158,11,.07);
      margin-bottom: 20px;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 70px);
      line-height: 1.25;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--accent);
    }

    .hero-text {
      color: #c5ccd4;
      font-size: 18px;
      max-width: 690px;
      margin-bottom: 28px;
    }

    .hero-points {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .hero-points span {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 10px;
      color: #dce2e8;
      font-size: 13px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 22px;
      border-radius: 12px;
      font-weight: 800;
      transition: .2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #111;
    }

    .btn-primary:hover {
      background: var(--accent2);
      transform: translateY(-2px);
    }

    .btn-secondary {
      border: 1px solid var(--line);
      background: #12171d;
      color: #fff;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hero-card {
      background: linear-gradient(145deg, #151b22, #0d1217);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .hero-card-icon {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245,158,11,.1);
      border: 1px solid rgba(245,158,11,.25);
      font-size: 40px;
      margin-bottom: 20px;
    }

    .hero-card h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .hero-card p {
      color: var(--muted);
      font-size: 15px;
    }

    section {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--muted);
    }

    .services {
      background: var(--bg2);
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .service-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      transition: .2s;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: rgba(245,158,11,.5);
    }

    .service-icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .service-card h3 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
    }

    .about {
      background: #090c10;
    }

    .about-box {
      background: linear-gradient(145deg, #11161c, #0d1217);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 35px;
    }

    .about-box h2 {
      font-size: 30px;
      margin-bottom: 18px;
    }

    .about-box p {
      color: #c2cad3;
      margin-bottom: 15px;
    }

    .about-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .about-list div {
      background: rgba(255,255,255,.035);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 15px;
    }

    .contact {
      background: var(--bg2);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .contact-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
    }

    .contact-card h3 {
      font-size: 23px;
      margin-bottom: 20px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-item:last-child {
      border-bottom: 0;
    }

    .contact-item .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245,158,11,.1);
      color: var(--accent);
      font-size: 20px;
      flex-shrink: 0;
    }
